name: include_dbt_sandbox
version: 1.0.0
profile: include_dbt_sandbox
model-paths:
- models
macro-paths:
- macros
analysis-paths:
- analyses
seed-paths:
- seeds
snapshot-paths:
- snapshots
clean-targets:
- target
- dbt_packages
vars:
  combined_studies:
  - inc_brainpower
models:
  +materialized: table
  include_dbt_sandbox:
    include:
      +tags:
      - study_stage
      - include
      brainpower:
        +tags:
        - brainpower
        src:
          +schema: inc_brainpower_src
        int:
          +schema: inc_brainpower_int
        stb:
          +schema: inc_brainpower_stb
    kids_first:
      +tags:
      - study_stage
      - kids_first
      sd_1nns3k8v:
        +tags:
        - sd_1nns3k8v
        - STUDY_SHORTCODE_HERE
        src:
          +schema: kf_sd_1nns3k8v_src
        int:
          +schema: kf_sd_1nns3k8v_int
    access:
      +tags:
      - access_stage
      +schema: access
    export:
      +tags:
      - export_stage
      fhir:
        +tags:
        - fhir
        +schema: fhir_export
    combined:
      +tags:
      - combined_stage
      +schema: combined
on-run-end:
  - "{{ grant_devs_access(tag='include', users_role='include_users') }}"
  - "{{ grant_devs_access(tag='kids_first', users_role='kf_users') }}"
