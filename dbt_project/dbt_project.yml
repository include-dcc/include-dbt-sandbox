name: include_dbt_sandbox
version: 1.0.0
profile: include_dbt_sandbox
model-paths:
- models
macro-paths:
- macros
analysis-paths:
- analyses
seed-paths:
- seeds
test-paths:
- tests
snapshot-paths:
- snapshots
clean-targets:
- target
- dbt_packages
vars:
  inc_studies:
  - inc_brainpower
  kf_studies:
  - sd_1nns3k8v
  common_access_data:
  - inc_common
  - kf_common
models:
  +materialized: table
  include_dbt_sandbox:
    include:
      +tags:
      - study_stage
      - include
      _inc_program:
        +tags:
        - inc_program
        +schema: inc_program
      brainpower:
        +tags:
        - brainpower
        src:
          +schema: inc_brainpower_src
        int:
          +schema: inc_brainpower_int
        stb:
          +schema: inc_brainpower_stb
    kids_first:
      +enabled: false
      +tags:
      - study_stage
      - kids_first
      _kf_program:
        +tags:
        - kf_program
        +schema: kf_program
      sd_1nns3k8v:
        +tags:
        - sd_1nns3k8v
        - STUDY_SHORTCODE_HERE
        src:
          +schema: kf_sd_1nns3k8v_src
        int:
          +schema: kf_sd_1nns3k8v_int
      chr_18:
        +tags:
        - chr_18
        src:
          +schema: kf_chr_18_src
        int:
          +schema: kf_chr_18_int
        stb:
          +schema: kf_chr_18_stb
    cdm:
      +tags:
      - cdm_stage
      inc_access:
        +tags:
        - access_stage
        +schema: inc_access
      inc_common:
        +tags:
        - common_stage
        +schema: inc_common
      kf_access:
        +enabled: false
        +tags:
        - access_stage
        +schema: kf_access
      kf_common:
        +enabled: false
        +tags:
        - common_stage
        +schema: kf_common
      combined_common:
        +enabled: false
        +tags:
        - common_stage
        +schema: combined_common

on-run-end:
- '{{ grant_devs_access(tag=''include'', users_role=''include_users'') }}'
- '{{ grant_devs_access(tag=''kids_first'', users_role=''kf_users'') }}'
